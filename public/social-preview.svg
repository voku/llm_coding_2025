<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Grid pattern overlay for tech aesthetic -->
  <g opacity="0.1">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#94a3b8" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#94a3b8" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#94a3b8" stroke-width="1"/>
  </g>
  
  <!-- Code bracket motif (left side) -->
  <g opacity="0.3">
    <path d="M 100 150 L 50 200 L 50 430 L 100 480" stroke="#6366f1" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- AI chip icon motif (right side) -->
  <g opacity="0.3" transform="translate(1050, 180)">
    <rect x="0" y="0" width="100" height="100" rx="8" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="50" cy="50" r="25" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="20" y1="30" x2="35" y2="30" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="65" y1="30" x2="80" y2="30" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="20" y1="70" x2="35" y2="70" stroke="#8b5cf6" stroke-width="3"/>
    <line x1="65" y1="70" x2="80" y2="70" stroke="#8b5cf6" stroke-width="3"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f1f5f9" text-anchor="middle">
    AI Coding Paradigms
  </text>
  
  <!-- Subtitle with gradient -->
  <text x="600" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#accent-gradient)" text-anchor="middle">
    2025
  </text>
  
  <!-- Tagline -->
  <text x="600" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Interactive comparison of modern AI-assisted coding approaches
  </text>
  
  <!-- Tech stack badges -->
  <g transform="translate(360, 460)">
    <!-- React badge -->
    <rect x="0" y="0" width="110" height="40" rx="20" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="55" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#6366f1" text-anchor="middle">React</text>
    
    <!-- TypeScript badge -->
    <rect x="130" y="0" width="140" height="40" rx="20" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="200" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#6366f1" text-anchor="middle">TypeScript</text>
    
    <!-- Interactive badge -->
    <rect x="290" y="0" width="140" height="40" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="360" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#8b5cf6" text-anchor="middle">Interactive</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="300" y="560" width="600" height="4" rx="2" fill="url(#accent-gradient)"/>
</svg>
